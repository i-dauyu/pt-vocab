<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<title>移住のポルトガル語 単語帳</title>
<meta name="apple-mobile-web-app-title" content="ポ語単語帳">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    color-scheme: light;
    --page: #f5f2ea;
    --surface: #fcfaf5;
    --ink: #191a1c;
    --ink-2: #5c5b56;
    --ink-3: #8f8c83;
    --line: rgba(25,26,28,0.11);
    --accent: #1c4a8a;
    --accent-wash: rgba(28,74,138,0.08);
    --on-accent: #fcfaf5;
    --up: #2d6a4f;
    --down: #b3412f;
    --mid: #9a6c24;
    --shadow: 0 1px 2px rgba(25,26,28,0.04), 0 12px 32px rgba(25,26,28,0.06);
    --serif: "Iowan Old Style", "Palatino", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: system-ui, -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #121315;
      --surface: #1b1c1f;
      --ink: #efece5;
      --ink-2: #b9b6ad;
      --ink-3: #85837b;
      --line: rgba(239,236,229,0.12);
      --accent: #8fb3e6;
      --accent-wash: rgba(143,179,230,0.13);
      --on-accent: #10192a;
      --up: #6fbf95;
      --down: #e58a7c;
      --mid: #d9ad62;
      --shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 36px 22px calc(104px + env(safe-area-inset-bottom)); }
  h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.3; letter-spacing: 0.01em; margin: 0; }
  h2 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 36px 0 6px; }
  .sub { color: var(--ink-2); margin: 6px 0 24px; }
  .eyebrow { font-family: var(--serif); font-style: italic; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  /* iPhone は16px未満の入力欄で画面が拡大される */
  .search, .pick { font-size: 16px; }
  [hidden] { display: none !important; }

  .primary {
    display: block; width: 100%; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; letter-spacing: 0.02em;
  }
  .primary:disabled { background: var(--accent-wash); color: var(--ink-3); cursor: default; }
  .ghost {
    border: 1px solid var(--line); background: transparent;
    border-radius: 999px; padding: 7px 15px; color: var(--ink-2); font-size: 14px;
  }
  .back { border: 0; background: none; padding: 4px 0; color: var(--ink-2); font-size: 14px; }
  .count { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .actions .ghost { flex: 1; white-space: nowrap; padding: 10px 12px; }

  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
    padding: 3px; border-radius: 11px; background: var(--accent-wash);
  }
  .seg.two { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
  .seg button { border: 0; background: transparent; color: var(--ink-2); padding: 9px 6px; border-radius: 9px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(25,26,28,0.1); }
  .field { margin-bottom: 26px; }
  .field > label, .field > .label { display: block; color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }
  .pick {
    width: 100%; padding: 11px 12px; border-radius: 11px;
    border: 0; background: var(--accent-wash);
  }

  /* ホーム */
  .masthead { margin-bottom: 26px; }
  .today {
    background: var(--surface); border-radius: 20px; padding: 24px 24px 22px; box-shadow: var(--shadow);
  }
  .today-main { display: flex; align-items: baseline; gap: 10px; }
  .today-num { font-family: var(--serif); font-size: 60px; line-height: 1; font-weight: 500; color: var(--accent); font-variant-numeric: lining-nums; }
  .today-label { color: var(--ink-2); }
  .today-meta { display: flex; gap: 28px; margin: 14px 0 20px; font-size: 13px; color: var(--ink-2); }
  .today-meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 5px; }
  .search {
    width: 100%; margin-top: 26px; padding: 11px 2px; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; border-radius: 0; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search:focus { border-bottom-color: var(--accent); }
  .search::placeholder { color: var(--ink-3); }
  .cats { display: grid; grid-template-columns: 1fr; column-gap: 32px; }
  @media (min-width: 620px) { .cats { grid-template-columns: 1fr 1fr; } }
  .cat {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 12px;
    width: 100%; padding: 14px 0 0; border: 0; background: none; text-align: left;
  }
  .cat-name { font-weight: 500; }
  .cat:hover .cat-name { color: var(--accent); }
  .cat-meta { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .cat-due { color: var(--accent); margin-right: 8px; }
  .cat-bar { grid-column: 1 / -1; height: 2px; margin-top: 6px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .cat-bar > i { display: block; height: 100%; background: var(--accent); }

  /* 語の一覧 */
  .play {
    position: relative; flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%;
    background: var(--accent-wash); vertical-align: middle;
  }
  .play::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 10px; transform: translate(-40%, -50%);
    background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  .play.small { width: 22px; height: 22px; margin-right: 6px; }
  .play.small::before { width: 7px; height: 8px; }
  .play.big { width: 56px; height: 56px; }
  .play.big::before { width: 15px; height: 17px; }
  .rows { margin-top: 8px; }
  .row, .list-row {
    display: grid; grid-template-columns: 30px 1fr 1fr; gap: 2px 12px; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere;
  }
  .row .pt, .list-row .pt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.35; }
  .row .ja, .list-row .ja { color: var(--ink-2); font-size: 14px; }
  .row .ex, .list-row .ex { grid-column: 2 / -1; color: var(--ink-3); font-size: 13px; margin-top: 4px; }
  .row .ex-ja, .list-row .ex-ja { display: block; padding-left: 28px; }
  .list-row { padding: 8px 0; }
  .list-row .known { color: var(--up); font-family: var(--sans); font-size: 12px; margin-left: 5px; }
  .no-ex .list-row .ex { display: none; }
  .hide-ja .list-row:not(.open) .ja { visibility: hidden; }
  .hide-ja .list-row { cursor: pointer; }
  .list-bar { position: sticky; top: 0; z-index: 2; margin: 14px -22px 0; padding: 10px 22px 10px; background: var(--page); border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -22px 8px; padding: 0 22px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 13px; padding: 5px 12px; }
  .toggles { display: flex; gap: 16px; }
  .toggles button { border: 0; background: none; padding: 2px 0; color: var(--ink-3); font-size: 13px; }
  .toggles button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  .list-group { scroll-margin-top: 104px; }

  /* トラック */
  .track {
    display: flex; align-items: center; gap: 14px; margin: 22px 0 8px; padding: 14px 16px;
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  }
  .track-toggle { position: relative; flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); }
  .track-toggle::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 13px; height: 15px; transform: translate(-40%, -50%);
    background: var(--on-accent); clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  .track-toggle.playing::before {
    width: 13px; height: 14px; transform: translate(-50%, -50%);
    clip-path: polygon(0 0, 36% 0, 36% 100%, 0 100%, 0 0, 64% 0, 100% 0, 100% 100%, 64% 100%, 64% 0);
  }
  .track-body { flex: 1; min-width: 0; }
  .track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .track-title { font-weight: 600; font-size: 14px; }
  .track-flow { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  .track-seek { display: block; width: 100%; height: 18px; margin: 2px 0; accent-color: var(--accent); }
  .track-time { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* 学習カード */
  .bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
  .flash {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    min-height: 340px; padding: 32px 24px; outline: none;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
  }
  .flash.short { min-height: 180px; }
  .flash .main { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .flash .trans { font-size: 18px; color: var(--ink-2); margin-top: 8px; }
  .flash .hint { color: var(--ink-3); font-size: 13px; margin-top: 18px; }
  .flash .example { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); width: 100%; }
  .flash .example .ex-pt { font-family: var(--serif); font-size: 18px; line-height: 1.4; }
  .flash .example .ex-ja { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .flash .note { color: var(--ink-3); font-size: 13px; margin-top: 12px; }
  .flash .audio { display: flex; gap: 8px; margin-top: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .rate button { padding: 14px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
  .rate .again { color: var(--down); }
  .rate .hard { color: var(--mid); }
  .rate .good { color: var(--up); }
  .keys { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 14px; }
  @media (hover: none) { .keys { display: none; } }

  /* テスト */
  .choices { display: grid; gap: 8px; margin-top: 14px; }
  .choices button {
    text-align: left; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); overflow-wrap: anywhere;
  }
  .choices button:disabled { cursor: default; color: var(--ink-3); }
  .choices .num { color: var(--ink-3); margin-right: 10px; font-size: 13px; }
  .choices button.correct { border-color: var(--up); color: var(--up); font-weight: 600; }
  .choices button.wrong { border-color: var(--down); color: var(--down); }
  .spell { display: grid; gap: 10px; margin-top: 14px; }
  .spell input {
    width: 100%; padding: 14px; font-family: var(--serif); font-size: 19px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); outline: none;
  }
  .spell input:focus { border-color: var(--accent); }
  .accents { display: flex; flex-wrap: wrap; gap: 4px; }
  .accents button { width: 36px; height: 36px; padding: 0; font-family: var(--serif); font-size: 16px; }
  .feedback { margin-top: 14px; padding: 18px 20px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
  .feedback .verdict { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .feedback .verdict.ok { color: var(--up); }
  .feedback .verdict.ng { color: var(--down); }
  .feedback .pt { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .feedback .ja, .feedback .ex-ja { color: var(--ink-2); font-size: 14px; }
  .feedback .ex-pt { font-family: var(--serif); margin-top: 10px; }
  .result { text-align: center; padding: 28px 0 8px; }
  .score { font-family: var(--serif); font-size: 56px; font-weight: 500; line-height: 1.1; color: var(--accent); }
  .nav2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .nav2 .ghost { padding: 11px; color: var(--ink); }

  /* 下のタブ */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--page); border-top: 1px solid var(--line);
  }
  .tabs button { flex: 1; max-width: 180px; padding: 15px 4px; border: 0; background: none; color: var(--ink-3); font-size: 13px; }
  .tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 4; transform: translateX(-50%);
    background: var(--ink); color: var(--page); padding: 9px 15px;
    border-radius: 10px; font-size: 13px; max-width: 90%;
  }
</style>
</head>
<body>
<main>
  <section id="home">
    <header class="masthead">
      <div class="eyebrow">Português de Portugal</div>
      <h1>移住のポルトガル語</h1>
    </header>
    <div class="today">
      <div class="today-main"><span class="today-num" id="tTotal">0</span><span class="today-label">語が今日の学習です</span></div>
      <div class="today-meta">
        <span>復習<b id="tDue">0</b></span>
        <span>新しい語<b id="tNew">0</b></span>
        <span>覚えた語<b id="tKnown">0</b></span>
      </div>
      <button class="primary" id="startToday">今日の学習を始める</button>
    </div>
    <input class="search" id="search" type="search" placeholder="単語を探す（日本語でもポルトガル語でも）">
    <div id="searchResults" class="rows" hidden></div>
    <div id="catsWrap"></div>
  </section>

  <section id="category" hidden>
    <div class="top">
      <button class="back" data-go-home>‹ もどる</button>
      <span class="count" id="catCount"></span>
    </div>
    <h1 id="catName"></h1>
    <p class="sub" id="catDesc"></p>
    <button class="primary" id="startCat">この場面を学習する</button>
    <div class="actions">
      <button class="ghost" id="startCatAll">全部カードで見る</button>
      <button class="ghost" id="testCat">この場面をテスト</button>
    </div>
    <div class="track" id="trackBox">
      <button class="track-toggle" id="trackToggle" aria-label="連続再生"></button>
      <div class="track-body">
        <div class="track-head">
          <span class="track-title">連続再生</span>
          <span class="track-flow">ポ語 → 日本語 → ポ語</span>
        </div>
        <input class="track-seek" id="trackSeek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
        <div class="track-time"><span id="trackNow">0:00</span><span id="trackLength">0:00</span></div>
      </div>
      <audio id="track" preload="none"></audio>
    </div>
    <div class="rows" id="catList"></div>
  </section>

  <section id="study" hidden>
    <div class="top">
      <button class="back" id="quitStudy">‹ やめる</button>
      <div class="bar"><i id="studyBar"></i></div>
      <span class="count" id="studyCount"></span>
    </div>
    <div class="flash" id="flash" tabindex="0"></div>
    <div class="rate" id="rate" hidden>
      <button class="again" data-rate="again">もう一度</button>
      <button class="hard" data-rate="hard">あやふや</button>
      <button class="good" data-rate="good">覚えた</button>
    </div>
    <button class="primary" id="reveal" style="margin-top:14px">答えを見る</button>
    <div class="keys">スペース: 答え ／ 1・2・3: 評価 ／ P: 発音 ／ E: 例文 ／ S: 速さ切り替え</div>
  </section>

  <section id="list" hidden>
    <div class="top" style="margin-bottom:0">
      <h1>全単語</h1>
      <span class="count" id="listCount"></span>
    </div>
    <div class="list-bar">
      <div class="chips" id="listChips"></div>
      <div class="toggles" role="group" aria-label="一覧の表示">
        <button id="listToggleEx">例文を表示</button>
        <button id="listToggleJa">訳を隠す</button>
      </div>
    </div>
    <div id="listBody"></div>
  </section>

  <section id="testSetup" hidden>
    <h1>テスト</h1>
    <p class="sub">結果は学習の復習予定には影響しません</p>
    <div class="field">
      <label for="testScope">範囲</label>
      <select class="pick" id="testScope"></select>
    </div>
    <div class="field">
      <div class="label">形式</div>
      <div class="seg two" id="testFormatSeg" role="group" aria-label="テストの形式">
        <button data-format="mean">意味を選ぶ</button>
        <button data-format="pick">ポ語を選ぶ</button>
        <button data-format="ear">聞いて選ぶ</button>
        <button data-format="spell">つづりを書く</button>
      </div>
    </div>
    <div class="field">
      <div class="label">問題数</div>
      <div class="seg" id="testCountSeg" role="group" aria-label="問題数">
        <button data-count="10">10問</button>
        <button data-count="20">20問</button>
        <button data-count="50">50問</button>
        <button data-count="0">全部</button>
      </div>
    </div>
    <button class="primary" id="startTest">テストを始める</button>
    <p class="count" id="testInfo" style="text-align:center"></p>
  </section>

  <section id="test" hidden>
    <div class="top">
      <button class="back" id="quitTest">‹ やめる</button>
      <div class="bar"><i id="testBar"></i></div>
      <span class="count" id="testProgress"></span>
    </div>
    <div class="flash short" id="testPrompt"></div>
    <div id="testAnswer"></div>
    <div class="feedback" id="testFeedback" hidden></div>
    <button class="primary" id="testNext" style="margin-top:14px" hidden>次へ</button>
    <div class="keys" id="testKeys"></div>
  </section>

  <section id="testResult" hidden>
    <div class="result">
      <div class="score" id="testScore"></div>
      <p class="sub" id="testScoreText" style="margin-bottom:20px"></p>
    </div>
    <button class="primary" id="retryWrong">間違えた語だけもう一度</button>
    <div class="nav2">
      <button class="ghost" id="backToSetup">別のテスト</button>
      <button class="ghost" data-go-home>ホームへ</button>
    </div>
    <div id="testWrongWrap">
      <h2>間違えた語</h2>
      <div class="rows" id="testWrongList"></div>
    </div>
  </section>

  <section id="settings" hidden>
    <h1>設定</h1>
    <p class="sub">学習カードの出し方と、発音の速さ</p>
    <div class="field">
      <div class="label">学習カードの出し方</div>
      <div class="seg" id="modeSeg" role="group" aria-label="出題の形式">
        <button data-mode="pt">ポ語を見る</button>
        <button data-mode="ja">日本語から</button>
        <button data-mode="ear">聞き取り</button>
      </div>
    </div>
    <div class="field">
      <div class="label">発音の速さ</div>
      <div class="seg" id="speedSeg" role="group" aria-label="発音の速さ">
        <button data-speed="0.7">ゆっくり</button>
        <button data-speed="0.85">少しゆっくり</button>
        <button data-speed="1">ふつう</button>
      </div>
    </div>
  </section>

  <section id="done" hidden>
    <div class="result" style="padding-top:64px">
      <h1>おつかれさまでした</h1>
      <p class="sub" id="doneText" style="margin-bottom:28px"></p>
      <button class="primary" data-go-home>ホームへ</button>
    </div>
  </section>
</main>
<nav class="tabs" id="tabs" aria-label="メインメニュー">
  <button data-tab="home">学習</button>
  <button data-tab="list">一覧</button>
  <button data-tab="test">テスト</button>
  <button data-tab="settings">設定</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="words.js"></script>
<script src="tracks.js"></script>
<script>
  const STORE_KEY = 'pt-vocab-v1';
  const NEW_PER_DAY = 10;
  const NEW_PER_SESSION = 10;
  const INTERVALS = [1, 3, 7, 14, 30, 60];
  const KNOWN_BOX = 3;
  const SPEEDS = [0.7, 0.85, 1];
  const CATEGORY_GROUPS = [
    ['はじめの一歩', ['basic', 'num', 'verb', 'word']],
    ['手続きとお金', ['gov', 'money', 'mail']],
    ['住まい', ['lease', 'repair', 'life', 'diy']],
    ['健康と安全', ['health', 'sos']],
    ['買い物と外出', ['shop', 'market', 'move', 'trip', 'hotel', 'car']],
    ['人とのやりとり', ['chat', 'feel', 'social', 'complain', 'phone']],
    ['家族と仕事', ['school', 'work', 'shoot']],
  ];
  const TAB_OF_SCREEN = {
    home: 'home', category: 'home', done: 'home', list: 'list',
    testSetup: 'test', testResult: 'test', settings: 'settings',
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const addDays = (n) => {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const shuffle = (list) => {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const ORDERED_CATEGORIES = CATEGORY_GROUPS.flatMap(([, ids]) => ids.map((id) => PT_CATEGORIES.find((c) => c.id === id)));

  // 語の一覧。進捗は読み上げ文から作った id で持つ
  const CARDS = ORDERED_CATEGORIES.flatMap((cat) => cat.words.map(([pt, ja, exPt, exJa, note]) => ({
    id: ptAudioId(pt), cat: cat.id, pt, ja, exPt, exJa, note,
  })));

  let store = loadStore();
  let session = null;
  let test = null;

  function loadStore() {
    const empty = {
      cards: {}, mode: 'pt', speed: 0.85, newLog: {},
      listEx: false, listHide: false, testFormat: 'mean', testCount: 10, testLog: {},
    };
    try {
      return { ...empty, ...JSON.parse(localStorage.getItem(STORE_KEY)) };
    } catch {
      return empty;
    }
  }
  function saveStore() {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  const isDue = (c) => store.cards[c.id] && store.cards[c.id].due <= today();
  const isNew = (c) => !store.cards[c.id];
  const isKnown = (c) => store.cards[c.id] && store.cards[c.id].box >= KNOWN_BOX;
  const newLeftToday = () => Math.max(0, NEW_PER_DAY - (store.newLog[today()] || 0));

  /* 音声 */
  const player = new Audio();
  player.preload = 'auto';
  let toastTimer;

  function toast(message) {
    $('toast').textContent = message;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3000);
  }

  // 音声ファイルが読めない時だけ端末の pt-PT の声を使う。ブラジルの声には落とさない
  function speakFallback(text) {
    const voice = speechSynthesis.getVoices().find((v) => v.lang.replace('_', '-') === 'pt-PT');
    if (!voice) {
      toast('音声ファイルが読み込めませんでした');
      return;
    }
    const utterance = new SpeechSynthesisUtterance(ptSpoken(text));
    utterance.voice = voice;
    utterance.lang = 'pt-PT';
    utterance.rate = store.speed;
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  function applySpeedToTrack() {
    $('track').defaultPlaybackRate = store.speed;
    $('track').playbackRate = store.speed;
  }

  function loadTrack(cat) {
    const info = PT_TRACKS[cat.id];
    $('track').pause();
    $('trackBox').hidden = !info;
    if (!info) return;
    $('track').src = `tracks/${cat.id}.m4a?v=${info.version}`;
    $('track').dataset.title = cat.name;
    $('track').dataset.seconds = info.seconds;
    $('trackSeek').value = 0;
    $('trackNow').textContent = '0:00';
    $('trackLength').textContent = formatTime(info.seconds);
    applySpeedToTrack();
  }

  const formatTime = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  const trackLength = () => $('track').duration || Number($('track').dataset.seconds);

  function seekTrack() {
    const track = $('track');
    const time = ($('trackSeek').value / 1000) * trackLength();
    $('trackNow').textContent = formatTime(time);
    if (track.readyState >= 1) {
      track.currentTime = time;
    } else {
      track.addEventListener('loadedmetadata', () => { track.currentTime = time; }, { once: true });
      track.load();
    }
  }

  function play(text) {
    $('track').pause();
    player.onerror = () => speakFallback(text);
    player.src = `${PT_AUDIO_DIR}/${ptAudioId(text)}.mp3`;
    player.defaultPlaybackRate = store.speed;
    player.playbackRate = store.speed;
    player.play().catch((err) => {
      if (err.name !== 'AbortError') speakFallback(text);
    });
  }

  /* 画面 */
  function show(id) {
    if (id !== 'category') $('track').pause();
    for (const name of ['home', 'category', 'study', 'done', 'list', 'testSetup', 'test', 'testResult', 'settings']) $(name).hidden = name !== id;
    $('tabs').hidden = !TAB_OF_SCREEN[id];
    for (const btn of $('tabs').querySelectorAll('button')) {
      if (btn.dataset.tab === TAB_OF_SCREEN[id]) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    }
    window.scrollTo(0, 0);
  }

  function renderHome() {
    const due = CARDS.filter(isDue).length;
    const fresh = Math.min(newLeftToday(), CARDS.filter(isNew).length);
    $('tTotal').textContent = due + fresh;
    $('tDue').textContent = due;
    $('tNew').textContent = fresh;
    $('tKnown').textContent = `${CARDS.filter(isKnown).length} / ${CARDS.length}`;
    $('startToday').disabled = due + fresh === 0;
    $('startToday').textContent = $('startToday').disabled ? '今日の分は終わりました' : '今日の学習を始める';
    $('catsWrap').innerHTML = CATEGORY_GROUPS.map(([name, ids]) => `<h2>${esc(name)}</h2>
      <div class="cats">${ids.map(catRowHtml).join('')}</div>`).join('');
    show('home');
  }

  function catRowHtml(id) {
    const cat = PT_CATEGORIES.find((c) => c.id === id);
    const cards = CARDS.filter((c) => c.cat === id);
    const known = cards.filter(isKnown).length;
    const dueHere = cards.filter(isDue).length;
    return `<button class="cat" data-cat="${id}">
      <span class="cat-name">${esc(cat.name)}</span>
      <span class="cat-meta">${dueHere ? `<span class="cat-due">復習 ${dueHere}</span>` : ''}${known} / ${cards.length}</span>
      <span class="cat-bar"><i style="width:${(known / cards.length) * 100}%"></i></span>
    </button>`;
  }

  function openSettings() {
    for (const btn of $('modeSeg').querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', String(btn.dataset.mode === store.mode));
    }
    renderSpeedSeg();
    show('settings');
  }

  function rowHtml(c) {
    const example = c.exPt
      ? `<div class="ex"><button class="play small" data-say="${esc(c.exPt)}" aria-label="例文を再生"></button>${esc(c.exPt)}<span class="ex-ja">${esc(c.exJa)}</span></div>`
      : '';
    return `<div class="row">
      <button class="play" data-say="${esc(c.pt)}" aria-label="発音を再生"></button>
      <div class="pt">${esc(c.pt)}</div>
      <div class="ja">${esc(c.ja)}</div>
      ${example}
    </div>`;
  }

  function openCategory(id) {
    const cat = PT_CATEGORIES.find((c) => c.id === id);
    const cards = CARDS.filter((c) => c.cat === id);
    $('catName').textContent = cat.name;
    $('catDesc').textContent = cat.desc;
    $('catCount').textContent = `${cards.length}語`;
    $('catList').innerHTML = cards.map(rowHtml).join('');
    loadTrack(cat);
    const queue = pickQueue(cards);
    $('startCat').disabled = queue.length === 0;
    $('startCat').textContent = queue.length ? `この場面を学習する（${queue.length}語）` : 'この場面の今日の分は終わりました';
    $('startCat').onclick = () => startSession(pickQueue(cards));
    $('startCatAll').onclick = () => startSession(shuffle(cards), true);
    $('testCat').onclick = () => openTestSetup(id);
    show('category');
  }

  /* 学習 */
  function pickQueue(cards) {
    const due = shuffle(cards.filter(isDue));
    const fresh = cards.filter(isNew).slice(0, Math.min(NEW_PER_SESSION, newLeftToday()));
    return [...due, ...fresh];
  }

  function startSession(queue, practice = false) {
    if (!queue.length) return;
    session = { queue, total: queue.length, practice, revealed: false };
    show('study');
    showCard();
  }

  function showCard() {
    const c = session.queue[0];
    session.revealed = false;
    $('studyCount').textContent = `残り ${session.queue.length}`;
    $('studyBar').style.width = `${(1 - session.queue.length / session.total) * 100}%`;
    $('rate').hidden = true;
    $('reveal').hidden = false;
    const mode = store.mode;
    if (mode === 'pt') {
      $('flash').innerHTML = `<div class="main">${esc(c.pt)}</div>${audioButtons(c)}`;
      play(c.pt);
    } else if (mode === 'ja') {
      $('flash').innerHTML = `<div class="main">${esc(c.ja)}</div><div class="hint">ポルトガル語で言ってみてから答えを見る</div>`;
    } else {
      $('flash').innerHTML = `<div class="hint" style="margin-top:0">聞こえた語の意味を考える</div>${audioButtons(c)}`;
      play(c.pt);
    }
    $('flash').focus();
  }

  function audioButtons(c, withExample = false) {
    return `<div class="audio">
      <button class="play big" data-say="${esc(c.pt)}" aria-label="発音を再生"></button>
      ${withExample && c.exPt ? `<button class="ghost" data-say="${esc(c.exPt)}">例文を聞く</button>` : ''}
      <button class="ghost" data-speed-next>速さ ${store.speed}倍</button>
    </div>`;
  }

  function revealCard() {
    if (session.revealed) return;
    session.revealed = true;
    const c = session.queue[0];
    const example = c.exPt
      ? `<div class="example"><div class="ex-pt">${esc(c.exPt)}</div><div class="ex-ja">${esc(c.exJa)}</div></div>`
      : '';
    const note = c.note ? `<div class="note">${esc(c.note)}</div>` : '';
    $('flash').innerHTML = `<div class="main">${esc(c.pt)}</div><div class="trans">${esc(c.ja)}</div>${example}${note}${audioButtons(c, true)}`;
    $('rate').hidden = false;
    $('reveal').hidden = true;
    if (store.mode === 'ja') play(c.pt);
  }

  function rateCard(rate) {
    const c = session.queue.shift();
    if (!session.practice) {
      if (isNew(c)) store.newLog[today()] = (store.newLog[today()] || 0) + 1;
      const state = store.cards[c.id] || { box: 0 };
      if (rate === 'again') state.box = 0;
      if (rate === 'good') state.box = Math.min(state.box + 1, INTERVALS.length - 1);
      state.due = addDays(rate === 'hard' ? 1 : INTERVALS[state.box]);
      store.cards[c.id] = state;
      saveStore();
    }
    // 「もう一度」は数枚あとにもう一度出す
    if (rate === 'again') session.queue.splice(Math.min(3, session.queue.length), 0, c);
    if (session.queue.length) showCard();
    else finishSession();
  }

  function finishSession() {
    $('doneText').textContent = `${session.total}語を学習しました`;
    session = null;
    show('done');
  }

  /* 検索 */
  function renderSearch() {
    const q = $('search').value.trim().toLowerCase();
    $('searchResults').hidden = !q;
    $('catsWrap').hidden = Boolean(q);
    if (!q) return;
    const hits = CARDS.filter((c) => [c.pt, c.ja, c.exPt, c.exJa].some((s) => s && s.toLowerCase().includes(q)));
    $('searchResults').innerHTML = hits.length ? hits.map(rowHtml).join('') : '<div class="count">見つかりませんでした</div>';
  }

  /* 一覧 */
  function openList() {
    $('listCount').textContent = `全${CARDS.length}語`;
    $('listChips').innerHTML = ORDERED_CATEGORIES.map((cat) => `<button class="ghost" data-jump="${cat.id}">${esc(cat.name)}</button>`).join('');
    $('listBody').innerHTML = ORDERED_CATEGORIES.map((cat) => `<div class="list-group" id="group-${cat.id}">
      <h2>${esc(cat.name)}</h2>
      ${CARDS.filter((c) => c.cat === cat.id).map(listRowHtml).join('')}
    </div>`).join('');
    applyListView();
    show('list');
  }

  function listRowHtml(c) {
    const example = c.exPt
      ? `<div class="ex"><button class="play small" data-say="${esc(c.exPt)}" aria-label="例文を再生"></button>${esc(c.exPt)}<span class="ex-ja">${esc(c.exJa)}</span></div>`
      : '';
    return `<div class="list-row">
      <button class="play" data-say="${esc(c.pt)}" aria-label="発音を再生"></button>
      <div class="pt">${esc(c.pt)}${isKnown(c) ? '<span class="known">✓</span>' : ''}</div>
      <div class="ja">${esc(c.ja)}</div>
      ${example}
    </div>`;
  }

  function applyListView() {
    $('listBody').classList.toggle('no-ex', !store.listEx);
    $('listBody').classList.toggle('hide-ja', store.listHide);
    $('listToggleEx').setAttribute('aria-pressed', String(store.listEx));
    $('listToggleJa').setAttribute('aria-pressed', String(store.listHide));
  }

  /* テスト */
  // 意味が近く、選択肢に並ぶと両方正解に見える語
  const SIMILAR_WORDS = [
    ['o NIF', 'o número de contribuinte'],
    ['a marcação', 'o agendamento'],
    ['o formulário', 'o requerimento', 'o pedido'],
    ['a certidão', 'o comprovativo'],
    ['arranjar', 'reparar', 'a reparação'],
    ['avariado/a', 'estragado/a', 'não funciona'],
    ['a dor de barriga', 'a barriga'],
    ['o levantamento', 'levantar dinheiro'],
    ['a fatura', 'o recibo'],
    ['o seguro', 'o seguro de saúde'],
    ['o ladrão', 'o carteirista'],
    ['Socorro!', 'Ajude-me, por favor!', 'Preciso de ajuda.'],
    ['lindo/a', 'bonito/a', 'giro/a', 'fixe', 'ótimo/a'],
    ['A sério?', 'Não acredito!'],
    ['Que bom!', 'Ainda bem.'],
    ['Até à próxima.', 'Foi um prazer.'],
    ['De onde é?', 'Qual é a sua terra?'],
    ['saber', 'conhecer'],
    ['dizer', 'falar'],
    ['morar', 'viver'],
    ['velho/a', 'antigo/a'],
    ['o bebé', 'a criança'],
    ['talvez', 'quase'],
    ['ali', 'lá'],
    ['aqui', 'cá'],
    ['poder', 'conseguir'],
    ['a cirurgia', 'o internamento'],
    ['o teste', 'o exame'],
    ['Com os melhores cumprimentos', 'Cumprimentos', 'Atenciosamente'],
    ['Exmo. Senhor', 'Caro Senhor'],
    ['Exma. Senhora', 'Cara Senhora'],
    ['o erro', 'o engano'],
    ['Estou com frio.', 'Estou com calor.'],
    ['Sorria.', 'Sem sorrir, por favor.'],
    ['Fique assim.', 'Não se mexa.'],
    ['o reboque', 'o reboque do carro'],
    ['Lamento.', 'Lamento, não posso.'],
    ['a medida', 'à medida'],
    ['Faz sentido.', 'Não faz sentido.'],
    ['Concordo.', 'Não concordo.'],
    ['a bagagem', 'a mala', 'a bagagem de mão'],
    ['as chegadas', 'a chegada'],
    ['as partidas', 'a partida'],
    ['o embarque', 'a porta de embarque', 'o cartão de embarque'],
    ['o táxi', 'o TVDE', 'o taxista'],
    ['o motorista', 'o taxista'],
    ['o lugar', 'o lugar à janela', 'o lugar no corredor'],
    ['a feira', 'o mercado', 'a banca'],
    ['o peixe', 'o robalo', 'a dourada', 'o carapau', 'a cavala'],
    ['a fruta', 'a banana', 'a laranja', 'a maçã'],
    ['a matrícula', 'matricular'],
    ['a falta', 'faltar'],
    ['a escola primária', 'a escola secundária', 'a escola pública', 'a escola privada', 'a escola'],
  ];
  const baseJa = (c) => c.ja.replace(/（.*）/, '');
  const isPhrase = (c) => /[.?!]$/.test(c.pt);
  const areSimilar = (a, b) => baseJa(a) === baseJa(b) || SIMILAR_WORDS.some((g) => g.includes(a.pt) && g.includes(b.pt));

  function pickDistractors(c) {
    const fits = (x) => x.id !== c.id && isPhrase(x) === isPhrase(c) && !areSimilar(x, c);
    const candidates = [...shuffle(CARDS.filter((x) => fits(x) && x.cat === c.cat)), ...shuffle(CARDS.filter(fits))];
    const picked = [];
    for (const x of candidates) {
      if (picked.length === 3) break;
      if (!picked.some((p) => areSimilar(p, x))) picked.push(x);
    }
    return picked;
  }

  const stripAccents = (s) => s.normalize('NFD').replace(/\p{M}/gu, '');
  const normalizeSpelling = (s) => s.trim().toLowerCase().replace(/[.?!,]/g, '').replace(/\s+/g, ' ').replace(/^(o|a|os|as) /, '');

  // 冠詞はなくても正解。/a の語は男性形・女性形のどちらでも正解
  function checkSpelling(c, input) {
    const given = normalizeSpelling(input);
    const expected = normalizeSpelling(c.pt);
    const stem = expected.replace('/a', '');
    const answers = expected.includes('/a') ? [stem, stem.replace(/o$/, 'a')] : [expected];
    if (answers.includes(given)) return { ok: true, note: '' };
    if (answers.some((a) => stripAccents(a) === stripAccents(given))) {
      return { ok: true, note: 'アクセント記号に注意' };
    }
    return { ok: false, note: '' };
  }

  function testPool(scope) {
    if (scope === 'all') return CARDS;
    if (scope === 'learned') return CARDS.filter((c) => store.cards[c.id]);
    return CARDS.filter((c) => c.cat === scope);
  }

  function openTestSetup(scope = 'all') {
    $('testScope').innerHTML = [
      '<option value="all">全部の語</option>',
      '<option value="learned">学習した語だけ</option>',
      ...ORDERED_CATEGORIES.map((cat) => `<option value="${cat.id}">${esc(cat.name)}</option>`),
    ].join('');
    $('testScope').value = scope;
    renderTestSetup();
    show('testSetup');
  }

  function renderTestSetup() {
    const scope = $('testScope').value;
    const pool = testPool(scope);
    const count = store.testCount ? Math.min(store.testCount, pool.length) : pool.length;
    const last = store.testLog[scope];
    for (const btn of $('testFormatSeg').querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', String(btn.dataset.format === store.testFormat));
    }
    for (const btn of $('testCountSeg').querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', String(Number(btn.dataset.count) === store.testCount));
    }
    $('testInfo').textContent = pool.length
      ? `${count}問を出題${last ? ` ／ 前回 ${last.score}/${last.total}（${last.date}）` : ''}`
      : 'まだ学習した語がありません';
    $('startTest').disabled = pool.length === 0;
  }

  function startTest(cards, scope) {
    test = { cards, scope, format: store.testFormat, i: 0, wrong: [], options: [], answered: false };
    show('test');
    showQuestion();
  }

  function showQuestion() {
    const c = test.cards[test.i];
    test.answered = false;
    $('testProgress').textContent = `${test.i + 1} / ${test.cards.length}`;
    $('testBar').style.width = `${(test.i / test.cards.length) * 100}%`;
    $('testFeedback').hidden = true;
    $('testNext').hidden = true;
    const f = test.format;
    if (f === 'ear') {
      $('testPrompt').innerHTML = `<div class="audio" style="margin-top:0"><button class="play big" data-say="${esc(c.pt)}" aria-label="発音を再生"></button></div><div class="hint">聞こえた語の意味は？</div>`;
    } else {
      $('testPrompt').innerHTML = `<div class="main">${esc(f === 'mean' ? c.pt : c.ja)}</div>`;
    }
    if (f === 'spell') {
      $('testAnswer').innerHTML = `<div class="spell">
        <input id="spellInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ポルトガル語で入力（冠詞はなくてもOK）" lang="pt-PT">
        <div class="accents">${[...'áàâãçéêíóôõú'].map((ch) => `<button class="ghost" data-accent="${ch}">${ch}</button>`).join('')}</div>
        <button class="primary" id="spellCheck">答え合わせ</button>
      </div>`;
      $('testKeys').textContent = 'Enter: 答え合わせ・次へ';
      $('spellInput').focus();
    } else {
      test.options = shuffle([c, ...pickDistractors(c)]);
      $('testAnswer').innerHTML = `<div class="choices">${test.options.map((o, i) => `<button data-choice="${i}"><span class="num">${i + 1}</span>${esc(f === 'pick' ? o.pt : o.ja)}</button>`).join('')}</div>`;
      $('testKeys').textContent = '1〜4: 回答 ／ Enter: 次へ ／ P: 発音';
    }
    if (f === 'mean' || f === 'ear') play(c.pt);
  }

  function showFeedback(ok, note) {
    const c = test.cards[test.i];
    test.answered = true;
    if (!ok) test.wrong.push(c);
    const example = c.exPt
      ? `<div class="ex-pt"><button class="play small" data-say="${esc(c.exPt)}" aria-label="例文を再生"></button>${esc(c.exPt)}</div><div class="ex-ja">${esc(c.exJa)}</div>`
      : '';
    $('testFeedback').innerHTML = `<div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解' : '不正解'}${note ? `（${esc(note)}）` : ''}</div>
      <div class="pt"><button class="play small" data-say="${esc(c.pt)}" aria-label="発音を再生"></button>${esc(c.pt)}</div>
      <div class="ja">${esc(c.ja)}</div>${example}`;
    $('testFeedback').hidden = false;
    $('testNext').hidden = false;
    $('testNext').textContent = test.i + 1 < test.cards.length ? '次へ' : '結果を見る';
    play(c.pt);
  }

  function answerChoice(index) {
    if (test.answered || !test.options[index]) return;
    const c = test.cards[test.i];
    const buttons = [...$('testAnswer').querySelectorAll('button')];
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (test.options[i] === c) btn.classList.add('correct');
      else if (i === index) btn.classList.add('wrong');
    });
    showFeedback(test.options[index] === c, '');
  }

  function answerSpelling() {
    const input = $('spellInput');
    if (test.answered || !input.value.trim()) return;
    const { ok, note } = checkSpelling(test.cards[test.i], input.value);
    input.disabled = true;
    for (const btn of $('testAnswer').querySelectorAll('button')) btn.disabled = true;
    showFeedback(ok, note);
  }

  function nextQuestion() {
    if (!test.answered) return;
    test.i++;
    if (test.i < test.cards.length) showQuestion();
    else finishTest();
  }

  function finishTest() {
    const total = test.cards.length;
    const score = total - test.wrong.length;
    if (test.scope) {
      store.testLog[test.scope] = { score, total, date: today() };
      saveStore();
    }
    $('testScore').textContent = `${score} / ${total}`;
    $('testScoreText').textContent = test.wrong.length ? `正答率 ${Math.round((score / total) * 100)}%` : '全問正解です';
    $('testWrongList').innerHTML = test.wrong.map(rowHtml).join('');
    $('testWrongWrap').hidden = test.wrong.length === 0;
    $('retryWrong').hidden = test.wrong.length === 0;
    const wrong = shuffle(test.wrong);
    $('retryWrong').onclick = () => startTest(wrong, null);
    test = null;
    show('testResult');
  }

  function insertAccent(ch) {
    const input = $('spellInput');
    const start = input.selectionStart;
    input.setRangeText(ch, start, input.selectionEnd, 'end');
    input.focus();
  }

  /* 操作 */
  document.addEventListener('click', (e) => {
    const say = e.target.closest('[data-say]');
    if (say) return play(say.dataset.say);
    const cat = e.target.closest('[data-cat]');
    if (cat) return openCategory(cat.dataset.cat);
    if (e.target.closest('[data-go-home]')) return renderHome();
    const tab = e.target.closest('[data-tab]');
    if (tab) return { home: renderHome, list: openList, test: () => openTestSetup(), settings: openSettings }[tab.dataset.tab]();
    const jump = e.target.closest('[data-jump]');
    if (jump) return $(`group-${jump.dataset.jump}`).scrollIntoView();
    const format = e.target.closest('[data-format]');
    if (format) {
      store.testFormat = format.dataset.format;
      saveStore();
      return renderTestSetup();
    }
    const count = e.target.closest('[data-count]');
    if (count) {
      store.testCount = Number(count.dataset.count);
      saveStore();
      return renderTestSetup();
    }
    const choice = e.target.closest('[data-choice]');
    if (choice) return answerChoice(Number(choice.dataset.choice));
    const accent = e.target.closest('[data-accent]');
    if (accent) return insertAccent(accent.dataset.accent);
    if (e.target.closest('#spellCheck')) return answerSpelling();
    const listRow = e.target.closest('.hide-ja .list-row');
    if (listRow) return listRow.classList.toggle('open');
    if (e.target.closest('[data-speed-next]')) return cycleSpeed();
    const speed = e.target.closest('[data-speed]');
    if (speed) {
      setSpeed(Number(speed.dataset.speed));
      return play('Bom dia.');
    }
    const mode = e.target.closest('[data-mode]');
    if (mode) {
      store.mode = mode.dataset.mode;
      saveStore();
      return openSettings();
    }
    const rate = e.target.closest('[data-rate]');
    if (rate) rateCard(rate.dataset.rate);
  });

  function setSpeed(speed) {
    store.speed = speed;
    saveStore();
    applySpeedToTrack();
    for (const btn of document.querySelectorAll('[data-speed-next]')) btn.textContent = `速さ ${speed}倍`;
    renderSpeedSeg();
  }

  function cycleSpeed() {
    setSpeed(SPEEDS[(SPEEDS.indexOf(store.speed) + 1) % SPEEDS.length]);
  }

  function renderSpeedSeg() {
    for (const btn of $('speedSeg').querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', String(Number(btn.dataset.speed) === store.speed));
    }
  }

  $('startToday').onclick = () => {
    const due = shuffle(CARDS.filter(isDue));
    const fresh = CARDS.filter(isNew).slice(0, newLeftToday());
    startSession([...due, ...fresh]);
  };
  $('reveal').onclick = revealCard;
  $('quitStudy').onclick = () => { session = null; renderHome(); };
  $('search').oninput = renderSearch;
  $('trackToggle').onclick = () => ($('track').paused ? $('track').play() : $('track').pause());
  $('trackSeek').oninput = seekTrack;
  $('track').onpause = () => $('trackToggle').classList.remove('playing');
  $('track').ontimeupdate = () => {
    $('trackSeek').value = ($('track').currentTime / trackLength()) * 1000;
    $('trackNow').textContent = formatTime($('track').currentTime);
  };
  $('track').onplay = () => {
    $('trackToggle').classList.add('playing');
    player.pause();
    applySpeedToTrack();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: $('track').dataset.title, artist: '移住のポルトガル語' });
    }
  };
  $('listToggleEx').onclick = () => { store.listEx = !store.listEx; saveStore(); applyListView(); };
  $('listToggleJa').onclick = () => { store.listHide = !store.listHide; saveStore(); applyListView(); };
  $('testScope').onchange = renderTestSetup;
  $('startTest').onclick = () => {
    const scope = $('testScope').value;
    const pool = shuffle(testPool(scope));
    startTest(store.testCount ? pool.slice(0, store.testCount) : pool, scope);
  };
  $('testNext').onclick = nextQuestion;
  $('quitTest').onclick = () => { test = null; renderHome(); };
  $('backToSetup').onclick = () => openTestSetup();

  document.addEventListener('keydown', (e) => {
    if (!test || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (test.answered) nextQuestion();
      else if (test.format === 'spell') answerSpelling();
    } else if (e.target.id !== 'spellInput') {
      if (['1', '2', '3', '4'].includes(e.key)) answerChoice(Number(e.key) - 1);
      else if (e.key === 'p' && (test.format === 'mean' || test.format === 'ear' || test.answered)) play(test.cards[test.i].pt);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!session || e.metaKey || e.ctrlKey || e.altKey) return;
    const c = session.queue[0];
    if (e.code === 'Space') {
      e.preventDefault();
      revealCard();
    } else if (e.key === 'p' && (store.mode !== 'ja' || session.revealed)) {
      play(c.pt);
    } else if (e.key === 'e' && session.revealed && c.exPt) {
      play(c.exPt);
    } else if (e.key === 's') {
      cycleSpeed();
    } else if (session.revealed && ['1', '2', '3'].includes(e.key)) {
      rateCard(['again', 'hard', 'good'][Number(e.key) - 1]);
    }
  });

  speechSynthesis.getVoices();
  renderHome();
</script>
</body>
</html>
